{% extends 'base.html' %}
{% block content %}
    <div class="card shadow mx-auto mt-4 border-0" style="width: 650px;">

        <div class="card-header bg-light d-flex align-items-center gap-3 px-4 py-3">
            <img src="{{ employee.photo.url }}"
                 alt="{{ employee.first_name }} {{ employee.last_name }}"
                 class="rounded-circle object-fit-cover"
                 style="width: 56px; height: 56px;">
            <div>
                <small class="text-muted">Editing review for</small>
                <h5 class="mb-0">{{ employee.first_name }} {{ employee.last_name }}</h5>
            </div>
        </div>
        <div class="card-body px-5 py-4">
            <form method="POST" class="review-form">
                {% csrf_token %}
                {{ form }}
                <div class="d-flex justify-content-between align-items-center border-top pt-4 mt-4">
                    <button class="btn btn-outline-secondary px-4">Edit</button>
                    <a href="{% url 'reviews:current-employee-reviews' employee.id %}" class="btn btn-primary px-4">Cancel</a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
