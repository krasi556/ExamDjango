{% extends 'base.html' %}
{% block content %}
    <div class="row row-cols-1 row-cols-md-3 g-4">
        {% for employee in employees %}
            <div class="col">
                <a href="{% url 'reviews:leave-review' employee.id %}"
                   class="btn btn-light border-0 w-100 h-100 p-4 shadow-sm d-flex flex-column align-items-center justify-content-center text-center">
                    <h5 class="card-title mb-3">
                        {{employee.first_name}}
                    </h5>
                    <img src="{{ employee.photo.url }}"
                         class="rounded shadow-sm"
                         style="width: 120px; height: 120px; object-fit: cover;"
                         alt="{{ employee }}">
                </a>
            </div>
        {% endfor %}
    </div>
{% endblock %}
